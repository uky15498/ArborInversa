<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <rect width="720" height="260" fill="#faf8f4"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">

    <!-- 竖向的枝：一条向下生长的链 -->
    <rect x="60" y="34" width="170" height="46" rx="7" fill="#e3ece4" stroke="#8fb3a1" stroke-width="2"/>
    <text x="145" y="63" font-size="16" fill="#2c2822" text-anchor="middle">中国美术史</text>
    <text x="248" y="63" font-size="12" fill="#a99e8e">第 1 层</text>

    <line x1="145" y1="80" x2="145" y2="106" stroke="#8fb3a1" stroke-width="2"/>
    <path d="M145 106 l-4 -6 h8 z" fill="#8fb3a1"/>
    <rect x="60" y="106" width="170" height="46" rx="7" fill="#e3ece4" stroke="#8fb3a1" stroke-width="2"/>
    <text x="145" y="135" font-size="16" fill="#2c2822" text-anchor="middle">隋唐</text>
    <text x="248" y="135" font-size="12" fill="#a99e8e">第 2 层</text>

    <line x1="145" y1="152" x2="145" y2="178" stroke="#8fb3a1" stroke-width="2"/>
    <path d="M145 178 l-4 -6 h8 z" fill="#8fb3a1"/>
    <rect x="60" y="178" width="170" height="46" rx="7" fill="#e3ece4" stroke="#8fb3a1" stroke-width="2"/>
    <text x="145" y="207" font-size="16" fill="#2c2822" text-anchor="middle">吴道子</text>
    <text x="248" y="207" font-size="12" fill="#a99e8e">第 3 层</text>

    <line x1="145" y1="224" x2="145" y2="240" stroke="#8fb3a1" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- 右侧说明 -->
    <line x1="300" y1="60" x2="300" y2="230" stroke="#e3dbcc" stroke-width="1"/>
    <text x="330" y="76" font-size="14.5" fill="#2f5d50">竖向往下长，层数不限</text>
    <text x="330" y="106" font-size="13" fill="#3a342b">每一根枝都是一个节点，枝下面还能继续长枝。</text>
    <text x="330" y="132" font-size="13" fill="#3a342b">左栏的「目录树」就是照着这个方向排的：</text>
    <text x="330" y="158" font-size="13" fill="#3a342b">越往下越深，缩进越往右一层。</text>
    <rect x="330" y="180" width="330" height="44" rx="7" fill="#fbf8f2" stroke="#e7dfd0"/>
    <text x="346" y="199" font-size="12.5" fill="#645c4d">枝名右边那个「下含 N 枝」就是它的下枝数；</text>
    <text x="346" y="216" font-size="12.5" fill="#645c4d">点枝名就跳过去，路径会显示在最上面的面包屑里。</text>
  </g>
</svg>
